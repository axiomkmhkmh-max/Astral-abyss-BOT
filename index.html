<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Astral Abyss</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF3F3; --ink:#11282C; --mute:#72888B;
  --t1:#37B5AD; --t2:#86DDD4; --t3:#0D7F7E; --ice:#D6EEF0;
  --glass:rgba(255,255,255,.60); --glass2:rgba(255,255,255,.86);
  --lift:0 16px 34px -14px rgba(16,88,92,.26), inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.4);
  --px:50;
}
*{box-sizing:border-box;margin:0;padding:0;border:0;outline:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;background:none}
:focus-visible{box-shadow:0 0 0 3px rgba(55,181,173,.55)!important}

/* پس‌زمینه‌ی مات + صفحه‌ی هولوگرام */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(70% 45% at 92% -5%,rgba(55,181,173,.30),transparent 70%),
  radial-gradient(60% 40% at -10% 55%,rgba(190,225,235,.55),transparent 70%),
  radial-gradient(70% 40% at 80% 105%,rgba(55,181,173,.20),transparent 70%)}
#bg::before{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(17,40,44,.035) 0 1px,transparent 1px 4px)}
#bg::after{content:"";position:absolute;inset:-60%;
  background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.55),transparent 28%,rgba(55,181,173,.10),transparent 58%);
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{position:relative;z-index:1;height:100%;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(112px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1{font-size:27px;font-weight:800;letter-spacing:-.4px;line-height:1.3}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:18px}
.chip{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--lift);
  border-radius:99px;padding:8px 15px;font-size:12px;font-weight:500;color:var(--t3);white-space:nowrap}

/* فویل هولوگرامی: با لمس/شیب گوشی حرکت می‌کنه */
.foil{position:relative;overflow:hidden}
.foil::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--o,.5);mix-blend-mode:soft-light;
  background:linear-gradient(112deg,transparent 18%,rgba(255,255,255,.95) 36%,rgba(134,221,212,.7) 50%,rgba(214,238,240,.95) 64%,transparent 82%);
  background-size:280% 100%;background-position:calc(var(--px)*1%) 0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:30px;padding:15px;min-height:140px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--lift);text-align:right;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .18s}
.tile:active{transform:scale(.97)}
.tile.here{background:linear-gradient(145deg,rgba(55,181,173,.62),rgba(255,255,255,.85))}
.tile>*{position:relative;z-index:1}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.tile .nm{font-weight:800;font-size:15px;line-height:1.5}
.tile .en{font-size:11px;color:var(--mute);direction:ltr;text-align:right;margin-top:1px}

.orb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--t3);
  background:conic-gradient(from calc(var(--i,0)*27deg),#fff,var(--t2),#EAF8F8,var(--t1),#fff);
  -webkit-mask:none;box-shadow:0 8px 18px -6px rgba(55,181,173,.55), inset 0 0 0 5px rgba(255,255,255,.72)}
.zone{font-size:11px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--glass2);color:var(--t3);box-shadow:var(--lift)}
.zone.contested{color:#4E6F75}.zone.danger{background:#17363C;color:#BDEBE6;box-shadow:none}

.sec{font-size:13px;font-weight:500;color:var(--mute);margin:22px 4px 10px}
.extras{display:flex;gap:10px;flex-wrap:wrap}
.extras .tile{min-height:0;flex:1 1 140px;padding:13px 16px;border-radius:99px;flex-direction:row;align-items:center;gap:10px}

.btn{display:block;width:100%;border-radius:99px;padding:16px;font-weight:800;font-size:15px;color:#fff;text-align:center;cursor:pointer;
  background:linear-gradient(120deg,var(--t1),#6AD8CE 50%,var(--t1));background-size:200% 100%;
  box-shadow:0 14px 26px -10px rgba(55,181,173,.65);transition:.25s}
.btn:active{transform:scale(.98);background-position:100% 0}
.btn.soft{background:var(--glass2);color:var(--t3);box-shadow:var(--lift)}
.btn[disabled]{opacity:.42;pointer-events:none}

.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(17,40,44,.28);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;background:rgba(247,251,251,.94);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-radius:34px 34px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);
  transition:transform .35s cubic-bezier(.2,.9,.3,1);box-shadow:0 -24px 60px rgba(16,88,92,.2)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(17,40,44,.14);margin:-8px auto 18px}
.sheet h2{font-size:22px;font-weight:800}
.sheet .jp{color:var(--mute);font-size:12px;margin:3px 0 14px;direction:ltr;text-align:right}
.sheet p.lb{color:var(--mute);font-size:13px;margin:4px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pill{background:var(--glass2);border-radius:99px;padding:7px 14px;font-size:12px;box-shadow:var(--lift)}
.pill.ltr{direction:ltr}

.places{display:grid;gap:8px;margin-bottom:16px}
.place{display:flex;flex-direction:column;gap:1px;background:var(--glass2);border-radius:99px;padding:9px 20px;box-shadow:var(--lift)}
.place b{font-size:13px;font-weight:800}.place span{font-size:11px;color:var(--mute)}
.tools{display:flex;gap:8px;overflow-x:auto;margin:-6px 0 14px;padding:6px 2px 10px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;border-radius:99px;padding:9px 16px;font-size:12px;font-weight:500;background:var(--glass);color:var(--mute);box-shadow:var(--lift);cursor:pointer}
.tools button.on{background:linear-gradient(120deg,var(--t1),#6AD8CE);color:#fff}
.worth{margin-bottom:14px;border-radius:99px;padding:12px 18px;background:var(--glass);box-shadow:var(--lift);display:flex;justify-content:space-between;font-size:13px}
.worth b{font-weight:800;color:var(--t3)}
.receipt{display:grid;gap:8px;margin-bottom:16px}
.receipt div{display:flex;justify-content:space-between;background:var(--glass2);border-radius:99px;padding:10px 20px;box-shadow:var(--lift);font-size:13px}
.receipt div:last-child{background:linear-gradient(120deg,var(--t1),#6AD8CE);color:#fff;font-weight:800}
/* کوله */
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{aspect-ratio:1;border-radius:26px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--lift);display:grid;place-items:center;font-size:30px;position:relative;cursor:pointer;transition:transform .15s}
.slot:active{transform:scale(.94)}
.slot b{position:absolute;bottom:7px;left:11px;font:500 11px Vazirmatn;color:var(--t3)}
.slot i,.dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%}
.r-common{background:#B9C8CA}.r-uncommon{background:#8ADCD3}.r-rare{background:#37B5AD}.r-epic{background:#0D7F7E}
.r-mythic,.r-legendary{background:linear-gradient(135deg,#37B5AD,#fff,#BFE3F2);box-shadow:0 0 8px rgba(55,181,173,.8)}
.empty{text-align:center;color:var(--mute);padding:64px 20px;font-size:14px;line-height:2.1}

/* سفر و لوت */
.stage{display:grid;place-items:center;margin:4px 0 18px}
.core{position:relative;width:214px;height:214px}
.core svg{position:absolute;inset:0;transform:rotate(-90deg)}
.core .disc{position:absolute;inset:20px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:18px;
  background:radial-gradient(circle at 50% 38%,#fff 0%,rgba(255,255,255,.9) 38%,rgba(134,221,212,.55) 100%);
  box-shadow:0 26px 50px -18px rgba(16,88,92,.45), inset 0 2px 0 #fff}
.core .disc::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:.55;mix-blend-mode:soft-light;
  background:conic-gradient(from calc(var(--px)*3.6deg),#fff,var(--t2),#fff,var(--ice),var(--t1),#fff)}
.core .disc>*{position:relative}
.core .big{font-size:34px;font-weight:800;line-height:1.2}
.core .nm{font-size:19px;font-weight:800;line-height:1.5}
.core small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.bars{display:grid;gap:10px;margin-bottom:12px}
.meter{display:flex;align-items:center;gap:12px;background:var(--glass);border-radius:99px;padding:9px 16px;box-shadow:var(--lift);font-size:12px}
.meter span{width:44px;color:var(--mute)}
.meter .tr{flex:1;height:8px;border-radius:9px;background:rgba(17,40,44,.08);overflow:hidden}
.meter .tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--t1),var(--t2));transition:width .5s}
.meter b{min-width:64px;text-align:left;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{border-radius:99px;background:var(--glass);box-shadow:var(--lift);padding:11px 8px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:800}.stat span{font-size:11px;color:var(--mute)}
.found{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.row{display:flex;align-items:center;gap:12px;background:var(--glass2);border-radius:99px;padding:7px 8px 7px 18px;box-shadow:var(--lift);animation:in .4s both}
.row .e{width:40px;height:40px;border-radius:50%;background:var(--ice);display:grid;place-items:center;font-size:21px}
.row span{font-size:13px;flex:1;direction:ltr;text-align:right}
.row em{font-style:normal;font-size:11px;color:var(--mute)}
.row .dot{position:static;flex:none}

nav{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:4px;padding:6px;border-radius:99px;background:rgba(255,255,255,.78);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 44px -12px rgba(16,88,92,.3), inset 0 1px 0 #fff}
nav button{font-weight:500;font-size:13px;padding:12px 26px;border-radius:99px;color:var(--mute);cursor:pointer;transition:.25s}
nav button.on{background:linear-gradient(120deg,var(--t1),#6AD8CE);color:#fff;box-shadow:0 10px 18px -8px rgba(55,181,173,.8)}
#toast{position:fixed;z-index:40;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-100px);
  background:rgba(17,40,44,.92);color:#fff;border-radius:99px;padding:11px 22px;font-size:13px;transition:.3s;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}

/* لابی و کرکتر */
.hero{position:relative;height:310px;border-radius:40px;overflow:hidden;box-shadow:var(--lift);margin-bottom:14px;display:grid;place-items:end center;cursor:pointer;
  background:radial-gradient(circle at 50% 88%,color-mix(in srgb,var(--cc,#37B5AD) 40%,transparent),transparent 62%),linear-gradient(180deg,rgba(255,255,255,.75),rgba(214,238,240,.6))}
.plat{position:absolute;bottom:18px;left:50%;width:210px;height:44px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.95),rgba(134,221,212,.45) 60%,transparent 72%);box-shadow:0 0 34px rgba(55,181,173,.45)}
.tag{position:absolute;top:14px;right:16px;z-index:2;display:flex;gap:6px}
.char{position:relative;height:262px;width:auto;max-width:92%;margin-bottom:24px;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none;
  transform-origin:50% 100%;filter:drop-shadow(0 12px 14px rgba(16,88,92,.28));animation:bob 2.6s ease-in-out infinite}
.char.abyss{filter:drop-shadow(0 0 16px rgba(124,107,234,.85)) drop-shadow(0 12px 14px rgba(16,88,92,.28)) hue-rotate(-24deg) saturate(1.15)}
.spk{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px rgba(134,221,212,.9);animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-12px);opacity:.5}}
@keyframes bob{50%{transform:translateY(-5px) scale(1.012)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-9px) rotate(1.6deg)}}
.walk .char{animation:walk .62s ease-in-out infinite}
@keyframes jump{40%{transform:translateY(-34px) scale(1.04)}}
.jump .char{animation:jump .55s cubic-bezier(.3,1.6,.5,1)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <section class="view on" id="v-lobby">
    <div class="head"><div><h1 id="lbName">لابی</h1><div class="sub" id="lbSub"></div></div><div class="chip" id="lbWhere">-</div></div>
    <div class="hero" id="hero"></div>
    <div class="bars">
      <div class="meter"><span>سلامت</span><div class="tr"><i id="lhp"></i></div><b id="lhpt"></b></div>
      <div class="meter"><span>زن</span><div class="tr"><i style="width:100%"></i></div><b id="lzen"></b></div>
    </div>
    <div class="duo"><button class="btn soft" data-go="realms">قلمروها</button><button class="btn" data-go="trip">سفر و جستجو</button></div>
  </section>

  <section class="view" id="v-realms">
    <div class="head"><div><h1>قلمروها</h1><div class="sub" id="rsub"></div></div><div class="chip" id="where">-</div></div>
    <div class="grid" id="realms"></div>
    <div id="extraWrap" hidden><div class="sec">مکان‌های ویژه</div><div class="extras" id="extras"></div></div>
  </section>

  <section class="view" id="v-bag">
    <div class="head"><div><h1>کوله‌پشتی</h1><div class="sub" id="bagsub"></div></div></div>
    <div class="tools" id="tools"></div>
    <div class="worth" id="worth"></div>
    <div class="bag" id="bag"></div>
    <div id="sellAllWrap" style="margin-top:18px"><button class="btn soft" id="sellAll">فروش همه‌ی کوله</button></div>
  </section>

  <section class="view" id="v-trip">
    <div class="head"><div><h1>سفر و لوت</h1><div class="sub" id="who"></div></div></div>
    <div class="stage"><div class="core" id="core"></div></div>
    <div class="bars">
      <div class="meter"><span>سلامت</span><div class="tr"><i id="hpbar"></i></div><b id="hptxt"></b></div>
      <div class="meter"><span>زن</span><div class="tr"><i id="zenbar" style="width:100%"></i></div><b id="zentxt"></b></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-act">۰</b><span>اقدام</span></div>
      <div class="stat"><b id="s-day">۰</b><span>سهم امروز</span></div>
      <div class="stat"><b id="s-lv">۰</b><span>سطح</span></div>
    </div>
    <button class="btn" id="lootBtn">جستجو در این قلمرو</button>
    <div class="found" id="found"></div>
  </section>
</main>

<nav>
  <button class="on" data-v="lobby">لابی</button>
  <button data-v="realms">قلمرو</button>
  <button data-v="bag">کوله</button>
  <button data-v="trip">سفر</button>
</nav>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#EDF3F3"); tg.setBackgroundColor("#EDF3F3"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const $ = s => document.querySelector(s);
const fa = n => Number(n).toLocaleString("en").replace(/,/g, "٬").replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const hap = t => { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
const ZONE = {safe: "امن", contested: "مورد مناقشه", danger: "خطرناک"};
const TIER = {common: "عادی", rare: "نادر", epic: "حماسی", legendary: "افسانه‌ای"};
const RAR = {common: "عادی", uncommon: "کم‌یاب", rare: "نادر", epic: "حماسی", mythic: "اسطوره‌ای", legendary: "افسانه‌ای"};
const TIER_O = {common: .35, rare: .55, epic: .8, legendary: 1};
let R = [], S = null, timer = null;

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"X-Init-Data": tg ? tg.initData : "", "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "خطا");
  return j;
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.k); toast.k = setTimeout(() => t.classList.remove("on"), 2400); }
const faName = d => d.desc.split(" — ")[0];
const jpName = d => d.desc.split(" — ")[1] || "";
const realm = k => R.find(r => r.key === k);
const dur = s => s <= 0 ? "فوری" : s < 60 ? fa(s) + " ثانیه" : fa(Math.round(s / 60)) + " دقیقه";

/* فویل هولوگرام: لمس و شیب گوشی */
let raf = 0;
const foil = x => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => document.documentElement.style.setProperty("--px", Math.max(0, Math.min(100, x)).toFixed(1))); };
addEventListener("pointermove", e => foil(e.clientX / innerWidth * 100));
addEventListener("deviceorientation", e => { if (e.gamma != null) foil(50 + e.gamma * 1.6); });

/* قلمروها */
const tileHTML = (d, i) => `
  <button class="tile foil ${S && S.map === d.key ? "here" : ""}" style="--o:${TIER_O[d.tier] || .4}" data-k="${d.key}">
    <div class="top"><div class="orb" style="--i:${i}">${d.key[0]}</div><span class="zone ${d.zone}">${ZONE[d.zone]}</span></div>
    <div><div class="nm">${faName(d)}</div><div class="en">${d.key}</div></div>
  </button>`;
function drawRealms() {
  const core = R.filter(r => r.core), extra = R.filter(r => !r.core);
  $("#rsub").textContent = fa(core.length) + " قلمرو";
  $("#realms").innerHTML = core.map(tileHTML).join("");
  $("#extraWrap").hidden = !extra.length;
  $("#extras").innerHTML = extra.map((d, i) => `
    <button class="tile foil ${S && S.map === d.key ? "here" : ""}" style="--o:${TIER_O[d.tier] || .4}" data-k="${d.key}">
      <div class="orb" style="--i:${i + 14}">${d.key[0]}</div><div><div class="nm">${faName(d)}</div></div>
    </button>`).join("");
  $("#where").textContent = S && realm(S.map) ? faName(realm(S.map)) : "بدون قلمرو";
}
function openSheet(html) { $("#sheet").innerHTML = '<div class="grab"></div>' + html; $("#sheet").classList.add("on"); $("#sbg").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); $("#sbg").classList.remove("on"); }
$("#sbg").onclick = closeSheet;

function realmSheet(k) {
  const d = realm(k), here = S && S.map === k, busy = S && S.traveling;
  openSheet(`
    <h2>${faName(d)}</h2><div class="jp">${d.key} &nbsp; ${jpName(d)}</div>
    <div class="pills"><span class="pill">${ZONE[d.zone]}</span><span class="pill">${TIER[d.tier] || d.tier}</span><span class="pill">سفر: ${here ? "فوری" : dur(d.secs)}</span></div>
    ${d.places && d.places.length ? '<p class="lb">مکان‌های قلمرو</p><div class="places">' + d.places.map(p => `<div class="place"><b>${p.name}</b><span>${p.desc}</span></div>`).join("") + "</div>" : ""}
    ${d.loot.length ? '<p class="lb">منابع این قلمرو</p>' : ""}
    <div class="pills">${d.loot.map(l => `<span class="pill ltr">${l.name}</span>`).join("")}</div>
    <button class="btn" id="go" ${here || busy ? "disabled" : ""}>${here ? "همین‌جایی" : busy ? "در حال سفر" : "حرکت به این قلمرو"}</button>`);
  $("#go").onclick = async () => {
    try { S = await api("/api/travel", {map: k}); hap("medium"); closeSheet(); drawAll(); show("trip"); toast(S.traveling ? "سفر آغاز شد" : "رسیدی"); }
    catch (e) { toast(e.message); }
  };
}
$("#v-realms").onclick = e => { const t = e.target.closest(".tile"); if (t) { hap(); realmSheet(t.dataset.k); } };

/* کوله */
let filt = "all";
const ORDER = ["legendary", "mythic", "epic", "rare", "uncommon", "common"];
function groups() {
  const m = new Map();
  (S.inventory || []).forEach(i => { const k = i.name + "|" + (i.emoji || ""); const c = m.get(k); c ? c.qty += i.qty : m.set(k, {...i}); });
  return [...m.values()].sort((x, y) => ORDER.indexOf(x.rarity) - ORDER.indexOf(y.rarity));
}
function receipt(r) {
  return `<div class="receipt"><div><span>تعداد</span><span>${fa(r.count)}</span></div><div><span>مبلغ کل</span><span>${fa(r.gross)}</span></div>
    <div><span>مالیات</span><span>${fa(r.tax)}</span></div><div><span>دریافتی خالص</span><span>${fa(r.net)}</span></div></div><button class="btn soft" id="cl">بستن</button>`;
}
async function sell(body) {
  try {
    S = await api("/api/sell", body); hap("heavy"); drawAll();
    openSheet("<h2>فروش انجام شد</h2><p class=\"lb\" style=\"margin-bottom:14px\">نتیجه‌ی معامله</p>" + receipt(S.sold)); $("#cl").onclick = closeSheet;
  } catch (e) { toast(e.message); }
}
function drawBag() {
  const all = groups(), items = filt === "all" ? all : all.filter(i => i.rarity === filt);
  const total = (S.inventory || []).reduce((a, i) => a + (i.sell || 0) * (i.qty || 1), 0);
  $("#bagsub").textContent = fa(all.length) + " نوع آیتم";
  const have = ["all", ...ORDER.filter(r => all.some(i => i.rarity === r))];
  $("#tools").innerHTML = have.map(r => `<button class="${r === filt ? "on" : ""}" data-r="${r}">${r === "all" ? "همه" : RAR[r]}</button>`).join("");
  $("#tools").onclick = e => { const b = e.target.closest("button"); if (b) { filt = b.dataset.r; drawBag(); } };
  $("#worth").innerHTML = `<span>ارزش تقریبی کوله</span><b>${fa(total)}</b>`;
  $("#sellAllWrap").hidden = !all.length; $("#worth").hidden = !all.length;
  $("#bag").innerHTML = items.length ? items.map((i, n) => `
    <button class="slot" data-n="${n}"><i class="r-${i.rarity}"></i>${i.emoji || ""}${i.qty > 1 ? `<b>${fa(i.qty)}</b>` : ""}</button>`).join("")
    : `<div class="empty" style="grid-column:1/-1">${all.length ? "آیتمی با این دسته نداری." : "کوله‌ات خالیه.<br>یه قلمرو انتخاب کن و جستجو کن."}</div>`;
  $("#bag").onclick = e => {
    const s = e.target.closest(".slot"); if (!s) return;
    const i = items[s.dataset.n]; hap();
    openSheet(`<div style="font-size:46px;line-height:1.2">${i.emoji || ""}</div>
      <h2 style="direction:ltr;text-align:right;margin-top:6px">${i.name}</h2>
      <p class="lb" style="margin:8px 0 14px;line-height:1.9">${i.desc || ""}</p>
      <div class="pills"><span class="pill">${RAR[i.rarity] || i.rarity}</span><span class="pill">ارزش فروش: ${fa(i.sell)}</span><span class="pill">تعداد: ${fa(i.qty)}</span></div>
      <button class="btn" id="sl">فروش ${i.qty > 1 ? "همه‌ی این آیتم" : "این آیتم"}</button>
      <button class="btn soft" id="cl" style="margin-top:10px">بستن</button>`);
    $("#cl").onclick = closeSheet;
    $("#sl").onclick = () => sell({name: i.name, emoji: i.emoji || ""});
  };
}
$("#sellAll").onclick = () => {
  hap();
  openSheet(`<h2>فروش همه‌ی کوله</h2><p class="lb" style="margin:6px 0 16px;line-height:1.9">همه‌ی آیتم‌ها با قیمت روز و کسر مالیات منطقه فروخته می‌شن و برگشتی نداره.</p>
    <button class="btn" id="yes">تأیید و فروش</button><button class="btn soft" id="cl" style="margin-top:10px">انصراف</button>`);
  $("#cl").onclick = closeSheet; $("#yes").onclick = () => sell({all: true});
};

/* سفر */
const C = 2 * Math.PI * 99;
function ring(frac) {
  return `<svg viewBox="0 0 214 214"><circle cx="107" cy="107" r="99" fill="none" stroke="rgba(55,181,173,.16)" stroke-width="7"/>
    <circle id="arc" cx="107" cy="107" r="99" fill="none" stroke="#37B5AD" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * frac}"/></svg>`;
}
function drawTrip() {
  const cur = S.map && realm(S.map), dest = S.traveling && realm(S.traveling);
  $("#who").textContent = S.name;
  $("#s-act").textContent = fa(S.actions); $("#s-day").textContent = fa(S.daily_left); $("#s-lv").textContent = fa(S.level);
  $("#hpbar").style.width = Math.max(0, Math.min(100, S.hp / (S.max_hp || 1) * 100)) + "%";
  $("#hptxt").textContent = fa(S.hp) + " / " + fa(S.max_hp);
  $("#zentxt").textContent = fa(S.zen);
  clearInterval(timer);
  if (dest) {
    const total = Math.max(1, S.travel_total || dest.secs || S.travel_left), end = Date.now() + S.travel_left * 1000;
    $("#core").innerHTML = ring(S.travel_left / total) + `<div class="disc"><div><div class="big" id="tl">${fa(S.travel_left)}</div><div class="nm">${faName(dest)}</div><small>در مسیر</small></div></div>`;
    timer = setInterval(async () => {
      const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      const el = $("#tl"); if (el) el.textContent = fa(left);
      const a = $("#arc"); if (a) a.style.strokeDashoffset = C * left / total;
      if (left <= 0) { clearInterval(timer); try { S = await api("/api/me"); drawAll(); hap("medium"); toast("به مقصد رسیدی"); } catch (e) { toast(e.message); } }
    }, 500);
  } else {
    $("#core").innerHTML = ring(0) + `<div class="disc"><div>${cur ? `<div class="nm">${faName(cur)}</div><small>${ZONE[cur.zone]}</small>` : `<div class="nm">بدون قلمرو</div><small>از تب قلمرو انتخاب کن</small>`}</div></div>`;
  }
  $("#lootBtn").toggleAttribute("disabled", !!dest || !cur);
}
$("#lootBtn").onclick = async () => {
  const b = $("#lootBtn"); b.setAttribute("disabled", "");
  try {
    S = await api("/api/loot", {}); hap("heavy"); drawAll();
    $("#found").innerHTML = S.found.length ? S.found.map((f, n) => `
      <div class="row" style="animation-delay:${n * .08}s"><div class="e">${f.emoji || ""}</div><span>${f.name}</span><em>${RAR[f.rarity] || ""}</em><i class="dot r-${f.rarity}"></i></div>`).join("")
      : `<div class="empty" style="padding:28px">این بار چیزی پیدا نشد.</div>`;
  } catch (e) { toast(e.message); drawTrip(); }
};

const CLS = {
  wizard:      {fa: "جادوگر",      c: "#7C6BEA", art: "warrior"},
  adventurer:  {fa: "ماجراجو",     c: "#E0605A", art: "adventurer"},
  merchant:    {fa: "تاجر",        c: "#E3A83A", art: "merchant"},
  healer:      {fa: "درمانگر",     c: "#35BF86", art: "healer"},
  abyss_avatar:{fa: "آواتارِ آبیس", c: "#7C6BEA", art: "warrior", abyss: true}
};
function charIMG(g, cl) {
  const k = CLS[cl] || CLS.adventurer, set = ART[g === "female" ? "female" : "male"];
  return `<img class="char${k.abyss ? " abyss" : ""}" src="${set[k.art]}" alt="${k.fa}" draggable="false">`;
}
function drawLobby() {
  const k = CLS[S.cls] || CLS.adventurer, trav = !!S.traveling;
  $("#lbName").textContent = S.name || "لابی";
  $("#lbSub").textContent = k.fa + " · سطح " + fa(S.level);
  $("#lbWhere").textContent = trav ? "در سفر" : (S.map && realm(S.map) ? faName(realm(S.map)) : "بدون قلمرو");
  const hero = $("#hero"); hero.style.setProperty("--cc", k.c); hero.classList.toggle("walk", trav);
  hero.innerHTML = '<div class="plat"></div>' + [[14,60,0],[80,30,.8],[26,24,1.5],[88,66,2.1],[50,12,2.8]].map(([l,t,dl]) => `<i class="spk" style="left:${l}%;top:${t}%;animation-delay:${dl}s"></i>`).join("") + charIMG(S.gender, S.cls);
  $("#lhp").style.width = Math.max(0, Math.min(100, S.hp / (S.max_hp || 1) * 100)) + "%";
  $("#lhpt").textContent = fa(S.hp) + " / " + fa(S.max_hp); $("#lzen").textContent = fa(S.zen);
}
$("#hero").onclick = () => { const h = $("#hero"); h.classList.remove("jump"); void h.offsetWidth; h.classList.add("jump"); hap("medium"); setTimeout(() => h.classList.remove("jump"), 600); };
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { hap(); show(b.dataset.go); });
function drawAll() { drawLobby(); drawRealms(); drawBag(); drawTrip(); }
function show(v) {
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-" + v));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("main").scrollTop = 0;
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { hap(); show(b.dataset.v); });

(async () => {
  try { [R, S] = await Promise.all([api("/api/realms"), api("/api/me")]); drawAll(); }
  catch (e) { $("main").innerHTML = `<div class="empty">${e.message}<br>مینی‌اپ رو از داخل ربات باز کن.</div>`; }
})();
</script>
