<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Astral Abyss</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080C;--s1:#0A1017;--s2:#0F1822;--line:#1C2935;--line2:#2B3C4B;--cy:#00FFF7;--steel:#8CA3B5;--tx:#E8F1F5;--mu:#7F909D;
  --red:#C2414B;--gold:#C9A24A;--ch:9px;--sat:0px;--sab:0px;--fillg:linear-gradient(180deg,#0F1822,#0A1017)}
*{box-sizing:border-box;margin:0;padding:0;border:0;outline:0;-webkit-tap-highlight-color:transparent}
html,body{height:var(--tg-viewport-stable-height,100dvh);background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:13px;line-height:1.7;overflow:hidden}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;cursor:pointer}button[disabled]{cursor:default}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.pn{--bd:var(--line);--fill:var(--fillg);position:relative;isolation:isolate;background:var(--bd);clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
.pn::before{content:"";position:absolute;inset:1px;z-index:-1;background:var(--fill);clip-path:polygon(calc(var(--ch) - .4px) 0,100% 0,100% calc(100% - var(--ch) + .4px),calc(100% - var(--ch) + .4px) 100%,0 100%,0 calc(var(--ch) - .4px))}
.pn.hot{--bd:var(--cy)}.pn.sm{--ch:6px}.pn.gl{--fill:rgba(6,10,15,.78)}
/* HUD */
#hud{flex:none;padding:calc(max(var(--sat),env(safe-area-inset-top,0px)) + 6px) 14px 8px;background:#070B10;border-bottom:1px solid var(--line);position:relative;z-index:5}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--cy),transparent 50%);opacity:.6}
.hrow{display:flex;align-items:center;gap:10px}
.lv{--ch:7px;width:38px;height:38px;flex:none;display:grid;place-items:center;--bd:var(--cy);--fill:var(--bg)}.lv b{font-size:16px;font-weight:800;color:var(--cy);line-height:1}
.who{flex:1;min-width:0}.who b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}.who span{color:var(--mu);font-size:11px}
.res{display:flex;gap:12px;font-weight:700;font-size:13px}.res span{display:flex;align-items:center;gap:5px}.res .i{width:16px;height:16px;color:var(--cy)}
.hp{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11px;color:var(--mu)}
.bar{flex:1;height:5px;background:#16212C;position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#0b8f8c,var(--cy));transition:width .5s}.bar.low i{background:var(--red)}
.hp span{min-width:74px;text-align:left;direction:ltr;color:var(--tx)}
main{flex:1;min-height:0;position:relative;background:var(--bg)}
.view{display:none;position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 20px}.view.on{display:block}
#v-home,#v-map{padding:0;overflow:hidden}
h1{font-size:21px;font-weight:800;line-height:1.4}h2{font-size:18px;font-weight:800;line-height:1.4}h3{font-size:13px;font-weight:700;color:var(--mu);margin:18px 2px 8px}
.sub{color:var(--mu);font-size:12px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.en{direction:ltr;unicode-bidi:isolate;color:var(--mu);font-size:11px;display:block;text-align:right}.ltr{direction:ltr;unicode-bidi:isolate}
.btn{--ch:7px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;font-weight:700;font-size:14px;--bd:var(--line2);--fill:var(--s2);color:var(--tx)}
.btn:active:not([disabled]){--fill:#16232F}.btn.main{--bd:var(--cy);--fill:var(--cy);color:#031213}.btn.warn{--bd:var(--red);--fill:var(--s1);color:#E58C93}
.btn.sm{padding:7px 12px;font-size:12px;width:auto}.btn[disabled]{opacity:.4}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:1px 8px;font-size:11px;white-space:nowrap;border-radius:2px;background:rgba(5,8,12,.6)}
.chip i{width:7px;height:7px;transform:rotate(45deg);flex:none}.chip.cy{border-color:var(--cy);color:var(--cy)}.chip.gold{border-color:var(--gold);color:var(--gold)}.chip.red{border-color:var(--red);color:#E58C93}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv div{padding:9px 6px;text-align:center}.kv b{display:block;font-size:16px;font-weight:800;line-height:1.5}.kv span{font-size:11px;color:var(--mu)}
.row{display:flex;align-items:center;gap:11px;padding:9px 12px}.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:700;font-size:13px;line-height:1.5}.row .t span{font-size:11px;color:var(--mu);display:block}
.stack{display:grid;gap:8px}.prog{margin-top:8px}.prog .bar{height:4px}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-bottom:5px}.meta b{color:var(--tx);font-weight:700}
/* صحنه: برش واقعی از نقشه‌ی بازی */
.crop{position:absolute;inset:0;background-image:var(--map);background-repeat:no-repeat;background-color:#070B10}
.hero{position:absolute;inset:0;overflow:hidden}
.hero>.crop{inset:-24px;filter:blur(3px) saturate(.8) brightness(.72)}
.hero .tint{position:absolute;inset:0;background:radial-gradient(90% 55% at 50% 42%,rgba(0,255,247,.07),transparent 70%),linear-gradient(180deg,rgba(5,8,12,.55) 0%,rgba(5,8,12,.15) 30%,rgba(5,8,12,.55) 62%,#05080C 92%)}
.fog{position:absolute;left:-30%;right:-30%;top:34%;height:34%;background:radial-gradient(50% 50% at 30% 50%,rgba(140,175,190,.13),transparent 70%),radial-gradient(40% 50% at 75% 60%,rgba(140,175,190,.09),transparent 70%);animation:dr 26s ease-in-out infinite alternate;pointer-events:none}
.fog.b{top:50%;animation-duration:34s;animation-direction:alternate-reverse;opacity:.8}
@keyframes dr{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
.loc{position:absolute;top:16px;right:16px;left:16px;text-shadow:0 2px 12px #000}.loc .lbl{font-size:11px;color:var(--cy)}.loc h1{font-size:24px;line-height:1.3}
.stage{position:absolute;left:0;right:0;bottom:150px;height:min(56%,410px);display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.stage .glow{position:absolute;bottom:6%;width:78%;height:86%;background:radial-gradient(50% 50% at 50% 55%,rgba(0,255,247,.16),transparent 70%)}
.stage .mist{position:absolute;left:-12%;right:-12%;bottom:-3%;height:24%;background:radial-gradient(60% 100% at 50% 100%,rgba(90,125,135,.3),transparent 75%)}
.stage .gnd{position:absolute;bottom:-3%;width:64%;height:9%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.85),transparent 72%)}
.char{position:relative;height:100%;width:auto;max-width:92%;object-fit:contain;object-position:bottom;filter:saturate(.88) brightness(.93) contrast(1.05) drop-shadow(0 10px 14px rgba(0,0,0,.7))}
.dock{position:absolute;left:12px;right:12px;bottom:12px;display:grid;gap:8px}.dock .row{padding:10px 14px}
.hero.sm .stage{bottom:0;height:88%}.hero.sm .tint{background:linear-gradient(180deg,rgba(5,8,12,.5),rgba(5,8,12,.1) 40%,#05080C 100%)}
.phero{position:relative;height:340px;margin:-14px -14px 0}
/* نقشه */
#mz{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none}
#mz img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
#mz svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mapBox{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#05080C}
#mapBox::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 10px rgba(5,8,12,.8)}
.mk{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;transform:scale(calc(1/var(--k,1)));z-index:2}
.mk i{width:15px;height:15px;transform:rotate(45deg);background:var(--zc);border:2px solid #05080C;box-shadow:0 0 0 1.5px rgba(232,241,245,.85),0 2px 8px #000}
.mk.on i{box-shadow:0 0 0 2px var(--cy),0 0 14px var(--cy)}.mk.here{z-index:3}
.mk.here::before,.mk.dest::before{content:"";position:absolute;inset:3px;border:2px solid var(--cy);border-radius:50%;animation:pl 2.4s ease-out infinite}.mk.dest::before{border-style:dashed}
.mk b{position:absolute;top:36px;font-size:11px;font-weight:700;white-space:nowrap;color:var(--cy);text-shadow:0 0 4px #000,0 0 8px #000,0 1px 3px #000;display:none}.mk.on b,.mk.here b{display:block}
@keyframes pl{from{transform:scale(.8);opacity:.9}to{transform:scale(1.9);opacity:0}}
.zc{position:absolute;top:12px;left:12px;display:grid;gap:6px;z-index:4}.zc button{--ch:6px;width:40px;height:40px;display:grid;place-items:center;--fill:rgba(6,10,15,.85)}
.mhd{position:absolute;top:12px;right:12px;z-index:4;padding:6px 14px;--fill:rgba(6,10,15,.85)}.mhd b{font-size:15px}
#rd{position:absolute;left:10px;right:10px;bottom:10px;z-index:4}#rd .row{padding:10px 12px;display:block}
#rd .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}#rd .btn{padding:9px 12px}
/* واحد مشترک */
.rp .strip{margin:1px 1px 0;height:110px;position:relative;overflow:hidden}.rp .strip>div:not(.crop){position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(180deg,transparent,rgba(10,16,23,.96))}
.rp .strip .crop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,12,.3),rgba(5,8,12,.5))}
.rp .body{padding:12px 14px 14px;display:grid;gap:12px}
.places{display:grid;gap:6px}.places div{border-right:2px solid var(--line2);padding:2px 10px}.places b{font-size:12.5px;font-weight:700;display:block;line-height:1.6}.places span{font-size:11px;color:var(--mu)}
.tools{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 2px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}
.tools button{--ch:5px;flex:none;padding:6px 14px;font-size:12px;color:var(--mu)}.tools button[aria-pressed=true]{color:var(--cy);--bd:var(--cy)}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{--ch:7px;aspect-ratio:1;display:grid;place-items:center;font-size:27px;--fill:radial-gradient(70% 70% at 50% 45%,color-mix(in srgb,var(--rc,#2B3C4B) 26%,#0A1017),#0A1017)}
.slot::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:2px;background:var(--rc,var(--line2));box-shadow:0 0 6px var(--rc,transparent)}
.slot b{position:absolute;top:5px;left:8px;font-size:11px;font-weight:700;color:var(--mu)}
.worth{display:flex;justify-content:space-between;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--mu)}.worth b{color:var(--cy);font-weight:800;font-size:14px}
.gem{width:46px;height:46px;--ch:7px;display:grid;place-items:center;font-size:25px;flex:none}
.rdot{width:8px;height:8px;transform:rotate(45deg);background:var(--rc);flex:none}
.empty{text-align:center;color:var(--mu);padding:34px 18px;line-height:2}.empty b{display:block;color:var(--tx);font-size:14px}
.skel{height:64px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.4s linear infinite;margin-bottom:10px}@keyframes sk{to{background-position:-200% 0}}
.fgrp{display:grid;gap:6px;margin-top:10px}.found{animation:in .25s both}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.locs{display:grid;gap:6px}.locs .ico{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--cy);flex:none}.locs .ico.fog{color:#4b5a68;border-style:dashed}.locs .fogname{color:var(--mu)}
.stat{margin-top:12px}.gl-war{padding:12px 14px;margin-bottom:10px}
.gcard{width:100%;text-align:right}.gcard .em{font-size:26px}
/* ناوبری */
nav{flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:#070B10;border-top:1px solid var(--line);padding-bottom:max(var(--sab),env(safe-area-inset-bottom,0px));position:relative;z-index:5}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 6px;font-size:10.5px;color:var(--mu);min-height:52px}
nav button .i{width:22px;height:22px}nav button[aria-current=page]{color:var(--cy)}
nav button[aria-current=page]::before{content:"";position:absolute;top:-1px;left:25%;right:25%;height:2px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
#sbg{position:fixed;inset:0;z-index:20;background:rgba(3,5,8,.72);opacity:0;pointer-events:none;transition:opacity .2s}#sbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;background:var(--s1);border-top:1px solid var(--cy);padding:16px 16px calc(18px + max(var(--sab),env(safe-area-inset-bottom,0px)));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.3,1);clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px)}
#sheet.on{transform:none}#sheet .grab{width:36px;height:3px;background:var(--line2);margin:-6px auto 14px}#sheet p{color:var(--mu);line-height:1.9;margin:6px 0 12px;white-space:pre-line}#sheet .stack{margin-top:12px}
#sheet .rp{margin:0}
.rcpt{display:grid;margin:10px 0 14px}.rcpt div{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line)}.rcpt div:last-child{border:0;color:var(--cy);font-weight:800;font-size:15px}
#toast{position:fixed;z-index:40;top:calc(max(var(--sat),env(safe-area-inset-top,0px)) + 10px);left:50%;transform:translate(-50%,-140%);visibility:hidden;background:var(--s2);border:1px solid var(--line2);border-right:3px solid var(--cy);padding:9px 18px;font-size:13px;transition:transform .25s;max-width:92%;text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}#toast.err{border-right-color:var(--red)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

</defs></svg>
<header id="hud"></header>
<main id="main">
  <div id="boot" style="position:absolute;inset:0;z-index:6;background:var(--bg);padding:14px"><div class="skel" style="height:360px"></div><div class="skel"></div><div class="skel"></div></div>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-map">
    <div id="mapBox"><div id="mz"><img id="mapImg" alt="نقشه‌ی جهان بازی" draggable="false"><svg id="mapLn" viewBox="0 0 1536 1024" preserveAspectRatio="none"></svg><div id="mks"></div></div></div>
    <div class="mhd pn"><b>نقشه‌ی جهان</b></div>
    <div class="zc"><button class="pn" data-act="zin" aria-label="بزرگ‌نمایی"><svg class="i"><use href="#i-plus"/></svg></button><button class="pn" data-act="zout" aria-label="کوچک‌نمایی"><svg class="i"><use href="#i-minus"/></svg></button><button class="pn" data-act="zhere" aria-label="موقعیت من"><svg class="i"><use href="#i-reset"/></svg></button></div>

<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp, root = document.documentElement;
function setInsets() {
  if (!tg) return;
  const a = tg.safeAreaInset || {}, c = tg.contentSafeAreaInset || {};
  root.style.setProperty("--sat", ((a.top || 0) + (c.top || 0)) + "px");
  root.style.setProperty("--sab", (a.bottom || 0) + "px");
}
if (tg) {

const HS = {
  "Frostheim": [193, 248], "Sands of Eternity": [542, 250], "Holy Luminarchy": [895, 250], "Celestial Spire": [1262, 257],
  "Dreadgate Citadel": [158, 497], "Abyssal Black Market": [568, 496], "Voidbreak Wastes": [850, 496], "Azure Tides Empire": [1206, 467],
  "Stormward Archipelago": [1244, 642], "The Sunken City": [168, 697], "Verdant Vale": [570, 698], "Emberhollow": [890, 704],
  "Dragonnest Peaks": [1255, 853], "Clockwork Depths": [135, 968], "Ruins of Orion-7": [560, 968], "Throne of Oblivion": [880, 968]
};
const CLS = {
  wizard: {fa: "جادوگر", art: "warrior"}, adventurer: {fa: "ماجراجو", art: "adventurer"}, merchant: {fa: "تاجر", art: "merchant"},
  healer: {fa: "درمانگر", art: "healer"}, abyss_avatar: {fa: "آواتارِ آبیس", art: "warrior"}
};
const sprite = () => ART[S.gender === "female" ? "female" : "male"][(CLS[S.cls] || CLS.adventurer).art];
const scene = (key) => `<div class="crop" data-k="${esc(key || "")}"></div>`;
// هر .crop ناحیه‌ی همان قلمرو را از نقشه‌ی اصلی برش می‌دهد
function cropAll() {
  $$(".crop").forEach(el => {
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const p = HS[el.dataset.k] || [768, 512], f = +(el.dataset.f || .5), w = r.width * (el.dataset.z || (el.parentElement.classList.contains("hero") ? 4.5 : 3.2)), h = w * IH / IW;
    el.style.backgroundSize = `${w}px ${h}px`;
    el.style.backgroundPosition = `${r.width / 2 - p[0] / IW * w}px ${r.height * f - (p[1] - 100) / IH * h}px`;
  });
}
addEventListener("resize", () => { cropAll(); if (view === "map") fitMap(); });
function confirmTravel(k) {
  const d = realm(k); if (!d) return;
  openSheet(`<h2>${esc(faName(d))}</h2><span class="en">${esc(d.key)}</span>
    <p>زمان سفر ${dur(d.secs)} است و تا رسیدن نمی‌تونی جستجو یا اکتشاف کنی.</p>
    <div class="chips">${zchip(d.zone)}${tchip(d.tier)}</div>
    <div class="stack"><button class="btn main pn" data-act="go!" data-k="${esc(d.key)}">تأیید و حرکت</button><button class="btn pn" data-act="close">انصراف</button></div>`);
}
async function doTravel(k) {
  try { setS(await api("/api/travel", {map: k})); hap("medium"); closeSheet(); await loadMap(); renderAll(); show("home"); toast(S.traveling ? "سفر آغاز شد" : "رسیدی"); }
  catch (e) { toast(e.message, 1); }
}
/* ───────── کوله ───────── */
function groups() {
  const m = new Map();
  (S.inventory || []).forEach(i => { const k = i.name + "|" + (i.emoji || ""); const c = m.get(k); c ? c.qty += i.qty : m.set(k, {...i}); });
  return [...m.values()].sort((x, y) => ORDER.indexOf(x.rarity) - ORDER.indexOf(y.rarity));
}
function renderBag() {
  const all = groups(), items = filt === "all" ? all : all.filter(i => i.rarity === filt); curItems = items;
  const total = (S.inventory || []).reduce((a, i) => a + (i.sell || 0) * (i.qty || 1), 0);
  $("#bagsub").textContent = fa(all.length) + " نوع آیتم";
  const have = ["all", ...ORDER.filter(r => all.some(i => i.rarity === r))];
  if (!have.includes(filt)) filt = "all";
  $("#tools").innerHTML = have.map(r => `<button class="pn" data-act="filter" data-r="${r}" aria-pressed="${r === filt}">${r === "all" ? "همه" : RAR[r]}</button>`).join("");
  $("#worth").innerHTML = `<span>ارزش تقریبی کوله</span><b>${fa(total)}</b>`;
  $("#sellAllWrap").hidden = $("#worth").hidden = !all.length;
  $("#bag").innerHTML = items.length ? items.map((i, n) => `<button class="slot pn" style="--rc:${RCOL[i.rarity] || "#6B7A87"}" data-act="item" data-n="${n}" aria-label="${esc(i.name)}">${esc(i.emoji || "")}${i.qty > 1 ? `<b>${fa(i.qty)}</b>` : ""}</button>`).join("")
    : `<div class="empty" style="grid-column:1/-1"><b>${all.length ? "آیتمی در این دسته نیست" : "کوله‌ات خالیه"}</b>${all.length ? "یه دسته‌ی دیگه رو امتحان کن." : "یه قلمرو انتخاب کن و جستجو کن تا آیتم پیدا کنی."}</div>`;
}
function itemSheet(i) {
  openSheet(`<div class="row" style="padding:0 0 10px"><div class="gem pn" style="--bd:${RCOL[i.rarity] || "var(--line2)"}">${esc(i.emoji || "")}</div><div class="t"><h2 class="ltr" style="text-align:right">${esc(i.name)}</h2><span class="chip" style="border-color:${RCOL[i.rarity]};margin-top:4px">${RAR[i.rarity] || esc(i.rarity)}</span></div></div>
    ${i.desc ? `<p>${esc(i.desc)}</p>` : ""}
    <div class="kv"><div class="pn sm"><b>${fa(i.sell)}</b><span>ارزش فروش</span></div><div class="pn sm"><b>${fa(i.qty)}</b><span>تعداد</span></div><div class="pn sm"><b>${i.locked ? "قفل" : "آزاد"}</b><span>وضعیت</span></div></div>
    <div class="stack">${i.locked ? "" : `<button class="btn main pn" data-act="sell" data-n="${curItems.indexOf(i)}">فروش ${i.qty > 1 ? "همه‌ی این آیتم" : "این آیتم"}</button>`}<button class="btn pn" data-act="close">بستن</button></div>`);
}
async function sell(body) {
  if (busy) return; busy = true;
  try {
    setS(await api("/api/sell", body)); hap("heavy"); await loadMap(); renderAll(); const r = S.sold;
    openSheet(`<h2>فروش انجام شد</h2><div class="rcpt"><div><span>تعداد</span><span>${fa(r.count)}</span></div><div><span>مبلغ کل</span><span>${fa(r.gross)}</span></div><div><span>مالیات</span><span>${fa(r.tax)}</span></div><div><span>دریافتی خالص</span><span>${fa(r.net)}</span></div></div><button class="btn pn" data-act="close">بستن</button>`);
  } catch (e) { toast(e.message, 1); } finally { busy = false; }
}

/* ───────── سفر، جستجو، اکتشاف ───────── */
async function loadMap() { if (S && S.map) { try { M = await api("/api/map"); } catch (e) { M = null; } } else M = null; }
function renderTrip() {
  const cur = S.map && realm(S.map), dest = S.traveling && realm(S.traveling), shown = dest || cur;
  $("#who").textContent = S.name || "";
  $("#tripStatus").innerHTML = `<div class="strip">${scene(shown && shown.key, shown && shown.zone)}<div><span class="sub" style="color:var(--cy)">${dest ? "در مسیر" : "موقعیت فعلی"}</span><h2>${shown ? esc(faName(shown)) : "بدون قلمرو"}</h2></div></div>
    <div class="body">${dest ? `<div><div class="meta"><span>رسیدن تا</span><b data-tl>${clock(S.travel_left)}</b></div><div class="bar"><i data-tb style="width:0"></i></div></div>`
      : shown ? `<div class="chips">${zchip(shown.zone)}${tchip(shown.tier)}</div>` : `<div class="empty" style="padding:6px"><b>هنوز قلمرویی انتخاب نکرده‌ای</b><button class="btn pn" style="margin-top:12px" data-go="map">رفتن به اطلس</button></div>`}</div>`;

const MZ = {x: 0, y: 0, k: 1, bw: 0, bh: 0, cw: 0, ch: 0};
function applyMZ() {

  MZ.x = w > MZ.cw ? Math.max(MZ.cw - w, Math.min(0, MZ.x)) : (MZ.cw - w) / 2; MZ.y = h > MZ.ch ? Math.max(MZ.ch - h, Math.min(0, MZ.y)) : (MZ.ch - h) / 2;
  const mz = $("#mz"); mz.style.transform = `translate(${MZ.x}px,${MZ.y}px) scale(${k})`; mz.style.setProperty("--k", k);
}
function centerOn(key, k) { if (k) MZ.k = k; const p = HS[key] || [768, 512]; MZ.x = MZ.cw / 2 - p[0] / IW * MZ.bw * MZ.k; MZ.y = MZ.ch * .38 - p[1] / IH * MZ.bh * MZ.k; applyMZ(); }

  MZ.cw = r.width; MZ.ch = r.height; MZ.bw = Math.max(r.height * IW / IH, r.width); MZ.bh = MZ.bw * IH / IW;
  const mz = $("#mz"); mz.style.width = MZ.bw + "px"; mz.style.height = MZ.bh + "px"; MZ.k = 1; centerOn(sel || (S && S.map));
}
function zoomAt(f, cx, cy) { const k2 = Math.max(1, Math.min(3, MZ.k * f)), r = k2 / MZ.k; MZ.x = cx - (cx - MZ.x) * r; MZ.y = cy - (cy - MZ.y) * r; MZ.k = k2; applyMZ(); }
(() => {
  const box = $("#mapBox"), ptrs = new Map(); let pd = 0, moved = 0, drag = false;
  box.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); moved = 0; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pd = Math.hypot(a.x - b.x, a.y - b.y); } });
  box.addEventListener("pointermove", e => {
    const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (ptrs.size === 1) { moved += Math.abs(dx) + Math.abs(dy); if (moved > 8) { if (!drag) { drag = true; try { box.setPointerCapture(e.pointerId); } catch (_) {} } MZ.x += dx; MZ.y += dy; applyMZ(); } }
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = box.getBoundingClientRect(); if (pd) zoomAt(d / pd, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pd = d; moved = 99; }
  });
  const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) setTimeout(() => { drag = false; }, 0); };

    let h = `<div class="row" style="padding:0 0 8px"><span style="font-size:32px">${g.emoji}</span><div class="t"><h2>${esc(g.name)}</h2><span>${esc(g.npc)}</span></div></div><p>${esc(g.desc)}</p>`;
    if (!g.member) h += `<div class="stack"><button class="btn main pn" data-act="gjoin" data-id="${esc(id)}">پیوستن به گیلد</button></div>`;
    else h += `<div class="meta"><span>رتبه‌ی ${esc(g.rank_fa)}${g.next_fa ? " ← " + esc(g.next_fa) : ""}</span><b>${fa(g.contribution)}${g.need ? " / " + fa(g.need) : ""}</b></div><div class="bar"><i style="width:${Math.round((g.pct || 0) * 100)}%"></i></div>
      <div class="kv stat"><div class="pn sm"><b>${fa(g.quests_done)}</b><span>کوئست انجام‌شده</span></div><div class="pn sm"><b>${fa(g.bonus_pct)}٪</b><span>پاداش رتبه</span></div><div class="pn sm"><b>${fa(g.perk_pct)}٪</b><span>${esc(g.perk_label || "مزیت")}</span></div></div>
      ${g.quest ? `<div class="chips" style="margin-top:10px"><span class="chip cy">کوئست فعال دارد (از ربات ادامه بده)</span></div>` : ""}
      <div class="stack"><button class="btn pn" data-act="gact" data-id="${esc(id)}" ${g.action_ready ? "" : "disabled"}>${esc(g.action.name)}${g.action_ready ? "" : " · " + dur(g.action_remain)}</button></div>`;
    openSheet(h);
  } catch (e) { closeSheet(); toast(e.message, 1); }
}
async function gOp(op, id) {
  if (busy) return; busy = true;
  try { const r = await api("/api/guild/" + op, {gid: id}); setS(r); toast(r.msg || "انجام شد", !r.ok); hap("medium"); renderAll(); await loadGuilds(); guildSheet(id); }
  catch (e) { toast(e.message, 1); } finally { busy = false; }
}

/* ───────── رویدادها و ناوبری ───────── */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { hap(); show(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return; const d = a.dataset;
  switch (d.act) {
    case "msel": hap(); sel = d.k; markMap(); renderDock(); break;
    case "rdet": hap(); openSheet(realmPanel(realm(sel))); cropAll(); break;
    case "zin": zoomAt(1.4, MZ.cw / 2, MZ.ch / 2); break;
    case "zout": zoomAt(.71, MZ.cw / 2, MZ.ch / 2); break;
    case "zhere": centerOn(S.map || sel, 1.6); break;
    case "gd": hap(); guildSheet(d.id); break;
    case "gjoin": gOp("join", d.id); break;
    case "gact": gOp("action", d.id); break;
    case "gretry": GFAIL = false; GU = null; renderGuild(); loadGuilds(); break;
  }
});
function show(v) {
  view = v;
  $$(".view").forEach(x => { x.classList.toggle("on", x.id === "v-" + v); x.scrollTop = 0; });
  $$("nav button").forEach(b => b.dataset.v === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  closeSheet(); if (v === "map") fitMap(); cropAll();
}
$$("nav button").forEach(b => b.onclick = () => { hap(); show(b.dataset.v); });

function renderAll() { renderHUD(); renderHome(); markMap(); renderDock(); renderChar(); renderBag(); renderGuild(); renderTrip(); startTimer(); cropAll(); }
async function boot() {
  try {
    const [r, s] = await Promise.all([api("/api/realms"), api("/api/me")]); R = r; setS(s);
    sel = S.map || (R[0] && R[0].key); buildMap(); await loadMap(); if (S.map && !M) failed = "map";
    $("#boot").hidden = true; renderAll(); loadGuilds();
  } catch (e) {
    $("#boot").innerHTML = `<div class="empty"><b>${esc(e.message)}</b>مینی‌اپ رو از داخل ربات باز کن.<br><button class="btn pn" style="margin-top:14px" onclick="location.reload()">تلاش دوباره</button></div>`;
  }
}
renderHUD(); boot();
</script>
