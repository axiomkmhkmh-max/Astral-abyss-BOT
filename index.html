<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Astral Abyss</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080C;--s1:#0A1017;--s2:#0F1822;--line:#1C2935;--line2:#2B3C4B;--cy:#00FFF7;--steel:#8CA3B5;--tx:#E8F1F5;--mu:#7F909D;
  --red:#C2414B;--gold:#C9A24A;--ch:9px;--sat:0px;--sab:0px;--fillg:linear-gradient(180deg,#0F1822,#0A1017)}
*{box-sizing:border-box;margin:0;padding:0;border:0;outline:0;-webkit-tap-highlight-color:transparent}
html,body{height:var(--tg-viewport-stable-height,100dvh);background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:13px;line-height:1.7;overflow:hidden}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;cursor:pointer}button[disabled]{cursor:default}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.pn{--bd:var(--line);--fill:var(--fillg);position:relative;isolation:isolate;background:var(--bd);clip-path:polygon(var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%,0 var(--ch))}
.pn::before{content:"";position:absolute;inset:1px;z-index:-1;background:var(--fill);clip-path:polygon(calc(var(--ch) - .4px) 0,100% 0,100% calc(100% - var(--ch) + .4px),calc(100% - var(--ch) + .4px) 100%,0 100%,0 calc(var(--ch) - .4px))}
.pn.hot{--bd:var(--cy)}.pn.sm{--ch:6px}.pn.gl{--fill:rgba(6,10,15,.78)}
/* HUD */
#hud{flex:none;padding:calc(max(var(--sat),env(safe-area-inset-top,0px)) + 6px) 14px 8px;background:#070B10;border-bottom:1px solid var(--line);position:relative;z-index:5}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--cy),transparent 50%);opacity:.6}
.hrow{display:flex;align-items:center;gap:10px}
.lv{--ch:7px;width:38px;height:38px;flex:none;display:grid;place-items:center;--bd:var(--cy);--fill:var(--bg)}.lv b{font-size:16px;font-weight:800;color:var(--cy);line-height:1}
.who{flex:1;min-width:0}.who b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}.who span{color:var(--mu);font-size:11px}
.res{display:flex;gap:12px;font-weight:700;font-size:13px}.res span{display:flex;align-items:center;gap:5px}.res .i{width:16px;height:16px;color:var(--cy)}
.hp{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11px;color:var(--mu)}
.bar{flex:1;height:5px;background:#16212C;position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#0b8f8c,var(--cy));transition:width .5s}.bar.low i{background:var(--red)}
.hp span{min-width:74px;text-align:left;direction:ltr;color:var(--tx)}
main{flex:1;min-height:0;position:relative;background:var(--bg)}
.view{display:none;position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 20px}.view.on{display:block}
#v-home,#v-map{padding:0;overflow:hidden}
h1{font-size:21px;font-weight:800;line-height:1.4}h2{font-size:18px;font-weight:800;line-height:1.4}h3{font-size:13px;font-weight:700;color:var(--mu);margin:18px 2px 8px}
.sub{color:var(--mu);font-size:12px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.en{direction:ltr;unicode-bidi:isolate;color:var(--mu);font-size:11px;display:block;text-align:right}.ltr{direction:ltr;unicode-bidi:isolate}
.btn{--ch:7px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 14px;font-weight:700;font-size:14px;--bd:var(--line2);--fill:var(--s2);color:var(--tx)}
.btn:active:not([disabled]){--fill:#16232F}.btn.main{--bd:var(--cy);--fill:var(--cy);color:#031213}.btn.warn{--bd:var(--red);--fill:var(--s1);color:#E58C93}
.btn.sm{padding:7px 12px;font-size:12px;width:auto}.btn[disabled]{opacity:.4}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:1px 8px;font-size:11px;white-space:nowrap;border-radius:2px;background:rgba(5,8,12,.6)}
.chip i{width:7px;height:7px;transform:rotate(45deg);flex:none}.chip.cy{border-color:var(--cy);color:var(--cy)}.chip.gold{border-color:var(--gold);color:var(--gold)}.chip.red{border-color:var(--red);color:#E58C93}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv div{padding:9px 6px;text-align:center}.kv b{display:block;font-size:16px;font-weight:800;line-height:1.5}.kv span{font-size:11px;color:var(--mu)}
.row{display:flex;align-items:center;gap:11px;padding:9px 12px}.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:700;font-size:13px;line-height:1.5}.row .t span{font-size:11px;color:var(--mu);display:block}
.stack{display:grid;gap:8px}.prog{margin-top:8px}.prog .bar{height:4px}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-bottom:5px}.meta b{color:var(--tx);font-weight:700}
/* صحنه: برش واقعی از نقشه‌ی بازی */
.crop{position:absolute;inset:0;background-image:var(--map);background-repeat:no-repeat;background-color:#070B10}
.loc{position:absolute;top:16px;right:16px;left:16px;text-shadow:0 2px 12px #000}.loc .lbl{font-size:11px;color:var(--cy)}.loc h1{font-size:24px;line-height:1.3}
/* نقشه */
#mz{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none}
#mz img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
#mz svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mapBox{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#05080C}
#mapBox::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 10px rgba(5,8,12,.8)}
.mk{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;transform:scale(calc(1/var(--k,1)));z-index:2}
.mk i{width:15px;height:15px;transform:rotate(45deg);background:var(--zc);border:2px solid #05080C;box-shadow:0 0 0 1.5px rgba(232,241,245,.85),0 2px 8px #000}
.mk.on i{box-shadow:0 0 0 2px var(--cy),0 0 14px var(--cy)}.mk.here{z-index:3}
.mk.here::before,.mk.dest::before{content:"";position:absolute;inset:3px;border:2px solid var(--cy);border-radius:50%;animation:pl 2.4s ease-out infinite}.mk.dest::before{border-style:dashed}
.mk b{position:absolute;top:36px;font-size:11px;font-weight:700;white-space:nowrap;color:var(--cy);text-shadow:0 0 4px #000,0 0 8px #000,0 1px 3px #000;display:none}.mk.on b,.mk.here b{display:block}
@keyframes pl{from{transform:scale(.8);opacity:.9}to{transform:scale(1.9);opacity:0}}
.zc{position:absolute;top:12px;left:12px;display:grid;gap:6px;z-index:4}.zc button{--ch:6px;width:40px;height:40px;display:grid;place-items:center;--fill:rgba(6,10,15,.85)}
.mhd{position:absolute;top:12px;right:12px;z-index:4;padding:6px 14px;--fill:rgba(6,10,15,.85)}.mhd b{font-size:15px}
#rd{position:absolute;left:10px;right:10px;bottom:10px;z-index:4}#rd .row{padding:10px 12px;display:block}
#rd .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}#rd .btn{padding:9px 12px}
/* واحد مشترک */
.rp .strip{margin:1px 1px 0;height:110px;position:relative;overflow:hidden}.rp .strip>div:not(.crop){position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(180deg,transparent,rgba(10,16,23,.96))}
.rp .strip .crop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,12,.3),rgba(5,8,12,.5))}
.rp .body{padding:12px 14px 14px;display:grid;gap:12px}
.places{display:grid;gap:6px}.places div{border-right:2px solid var(--line2);padding:2px 10px}.places b{font-size:12.5px;font-weight:700;display:block;line-height:1.6}.places span{font-size:11px;color:var(--mu)}
.tools{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 2px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}
.tools button{--ch:5px;flex:none;padding:6px 14px;font-size:12px;color:var(--mu)}.tools button[aria-pressed=true]{color:var(--cy);--bd:var(--cy)}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{--ch:7px;aspect-ratio:1;display:grid;place-items:center;font-size:27px;--fill:radial-gradient(70% 70% at 50% 45%,color-mix(in srgb,var(--rc,#2B3C4B) 26%,#0A1017),#0A1017)}
.slot::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:2px;background:var(--rc,var(--line2));box-shadow:0 0 6px var(--rc,transparent)}
.slot b{position:absolute;top:5px;left:8px;font-size:11px;font-weight:700;color:var(--mu)}
.worth{display:flex;justify-content:space-between;padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--mu)}.worth b{color:var(--cy);font-weight:800;font-size:14px}
.gem{width:46px;height:46px;--ch:7px;display:grid;place-items:center;font-size:25px;flex:none}
.rdot{width:8px;height:8px;transform:rotate(45deg);background:var(--rc);flex:none}
.empty{text-align:center;color:var(--mu);padding:34px 18px;line-height:2}.empty b{display:block;color:var(--tx);font-size:14px}
.skel{height:64px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.4s linear infinite;margin-bottom:10px}@keyframes sk{to{background-position:-200% 0}}
.fgrp{display:grid;gap:6px;margin-top:10px}.found{animation:in .25s both}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.locs{display:grid;gap:6px}.locs .ico{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--cy);flex:none}.locs .ico.fog{color:#4b5a68;border-style:dashed}.locs .fogname{color:var(--mu)}
.stat{margin-top:12px}.gl-war{padding:12px 14px;margin-bottom:10px}
.gcard{width:100%;text-align:right}.gcard .em{font-size:26px}
/* ناوبری */
#sbg{position:fixed;inset:0;z-index:20;background:rgba(3,5,8,.72);opacity:0;pointer-events:none;transition:opacity .2s}#sbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;background:var(--s1);border-top:1px solid var(--cy);padding:16px 16px calc(18px + max(var(--sab),env(safe-area-inset-bottom,0px)));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.3,1);clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px)}
#sheet.on{transform:none}#sheet .grab{width:36px;height:3px;background:var(--line2);margin:-6px auto 14px}#sheet p{color:var(--mu);line-height:1.9;margin:6px 0 12px;white-space:pre-line}#sheet .stack{margin-top:12px}
#sheet .rp{margin:0}
.rcpt{display:grid;margin:10px 0 14px}.rcpt div{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line)}.rcpt div:last-child{border:0;color:var(--cy);font-weight:800;font-size:15px}
#toast{position:fixed;z-index:40;top:calc(max(var(--sat),env(safe-area-inset-top,0px)) + 10px);left:50%;transform:translate(-50%,-140%);visibility:hidden;background:var(--s2);border:1px solid var(--line2);border-right:3px solid var(--cy);padding:9px 18px;font-size:13px;transition:transform .25s;max-width:92%;text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}#toast.err{border-right-color:var(--red)}
/* ───────── خانه‌ی سینمایی: صحنه، شخصیت، کارت‌ها ───────── */
.hero{position:absolute;inset:0;overflow:hidden;background:#02060A}
.scn{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .tint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,6,10,.55) 0,rgba(2,6,10,0) 22%,rgba(2,6,10,0) 60%,rgba(2,6,10,.78) 88%,#02060A 100%)}
.fog{position:absolute;left:-30%;right:-30%;top:50%;height:22%;background:radial-gradient(50% 50% at 30% 50%,rgba(120,205,210,.12),transparent 70%),radial-gradient(40% 50% at 75% 60%,rgba(120,205,210,.08),transparent 70%);animation:dr 26s ease-in-out infinite alternate;pointer-events:none}
.fog.b{top:62%;animation-duration:34s;animation-direction:alternate-reverse;opacity:.8}
@keyframes dr{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;bottom:18%;width:2px;height:2px;border-radius:50%;background:var(--cy);box-shadow:0 0 6px var(--cy);opacity:0;animation:mt linear infinite}
@keyframes mt{0%{transform:translateY(0);opacity:0}15%{opacity:.75}100%{transform:translateY(-46vh);opacity:0}}
.stage{position:absolute;left:0;right:0;bottom:var(--dk,128px);height:min(calc(100% - var(--dk,128px) - 134px),560px);display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.stage .aura{position:absolute;bottom:3%;width:92%;height:92%;background:radial-gradient(50% 50% at 50% 52%,rgba(0,255,247,.16),transparent 68%)}
.stage .gnd{position:absolute;bottom:-1%;width:58%;height:7%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.85),transparent 72%)}
.char{position:relative;height:100%;width:auto;max-width:96%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 14px rgba(0,255,247,.14)) drop-shadow(0 12px 14px rgba(0,0,0,.7))}
.char.legacy{height:84%;filter:saturate(.85) brightness(.92) drop-shadow(0 10px 14px rgba(0,0,0,.7))}
.hero.sm .stage{bottom:0;height:94%}
.phero{position:relative;height:400px;margin:-14px -14px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Immersive terrain backdrop: uses the bundled world artwork instead of the synthetic SVG skyline. */
.worldback{position:absolute;inset:-2%;background-image:var(--map);background-repeat:no-repeat;background-size:cover;background-position:center 32%;filter:brightness(.48) saturate(.72) contrast(1.12);transform:scale(1.03)}
.worldback::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,10,.18),rgba(2,6,10,.10) 30%,rgba(2,6,10,.62) 66%,#02060A 100%),linear-gradient(90deg,rgba(2,6,10,.22),transparent 42%,rgba(2,6,10,.30))}
#v-quests,#v-more,#v-market,#v-bank,#v-combat{padding-bottom:22px}
.feature-art{position:relative;min-height:180px;overflow:hidden;margin:-14px -14px 14px;padding:20px 16px 18px;background:#04090D;border-bottom:1px solid var(--line)}
.feature-art .worldback{opacity:.92}
.feature-art .art-copy{position:relative;z-index:2;max-width:75%;text-shadow:0 2px 10px #000}
.feature-art .art-copy .sub{color:#b7c9d3}
.feature-art h1{font-size:23px}
.feature-card{padding:13px;margin-bottom:9px}
.feature-card .row{padding:0}
.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.action-tile{min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:right;padding:13px;gap:10px}
.action-tile .i{width:24px;height:24px;color:var(--cy)}
.field{width:100%;border:1px solid var(--line2);background:#050A10;color:var(--tx);padding:11px 12px;min-height:42px;font:inherit;direction:ltr;text-align:left;border-radius:0}
.field::placeholder{color:#61727f}
.item-line{display:flex;align-items:center;gap:10px;padding:10px 11px}
.item-line .t{flex:1;min-width:0}
.item-line .t b{display:block;line-height:1.45}
.item-line .t span{display:block;color:var(--mu);font-size:11px}
.item-line .price{color:var(--cy);font-weight:800;white-space:nowrap;direction:ltr}
.note{padding:12px;border:1px solid var(--line);background:rgba(10,16,23,.8);color:var(--mu);line-height:1.9}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line2);font-size:11px;color:var(--steel)}
@media(max-width:360px){.action-grid{grid-template-columns:1fr}.feature-art{min-height:155px}.feature-art h1{font-size:20px}}

/* ───────── طراحی جدید: لابی و HUD مطابق مَکاپ؛ نقشه‌ی سه‌بعدی ───────── */
html{--u:calc(min(100vw,520px)/1024)}
.ori{font-family:Orbitron,"Segoe UI",system-ui,sans-serif}
/* HUD */
#hud{direction:ltr;padding:0;background:linear-gradient(180deg,#03080C,#06111A);border-bottom:1px solid rgba(0,255,247,.3);position:relative;z-index:5}
#hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cy),transparent);opacity:.7}
.hb{display:flex;align-items:center;justify-content:space-between;padding:calc(max(var(--sat),env(safe-area-inset-top,0px)) + var(--u)*14) calc(var(--u)*34) calc(var(--u)*6);height:calc(var(--u)*100 + max(var(--sat),env(safe-area-inset-top,0px)))}
.brand{display:flex;align-items:center;gap:calc(var(--u)*22)}.brand svg{width:calc(var(--u)*112);height:calc(var(--u)*80);filter:drop-shadow(0 0 6px rgba(0,255,247,.6))}
.brand b{font-size:calc(var(--u)*64);font-weight:700;letter-spacing:.05em;color:#EAF7FB;text-shadow:0 0 14px rgba(0,255,247,.35)}
.hb button{width:calc(var(--u)*80);height:calc(var(--u)*80);display:grid;place-items:center;color:#cfe9ee}.hb .i{width:calc(var(--u)*50);height:calc(var(--u)*50)}
.pr{display:flex;align-items:center;gap:calc(var(--u)*16);padding:calc(var(--u)*6) calc(var(--u)*20) calc(var(--u)*18)}
.pa{position:relative;flex:none;width:calc(var(--u)*158);height:calc(var(--u)*158);border-radius:50%;border:calc(var(--u)*4) solid rgba(0,255,247,.75);box-shadow:0 0 calc(var(--u)*30) rgba(0,255,247,.45),inset 0 0 calc(var(--u)*24) rgba(0,0,0,.6);background:radial-gradient(circle at 50% 35%,#12323c,#04090D);overflow:hidden;padding:0}
.pa img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.pid{flex:1;min-width:0;display:grid;gap:calc(var(--u)*2)}
.lvl{display:flex;align-items:center;gap:calc(var(--u)*16)}.lvl b{font-size:calc(var(--u)*42);font-weight:700;color:var(--cy);font-style:italic;white-space:nowrap}
.lvl i{flex:1;height:calc(var(--u)*6);background:rgba(0,255,247,.16);position:relative;transform:skewX(-30deg)}.lvl i s{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#0aa,var(--cy));box-shadow:0 0 8px var(--cy)}
.nm{font-size:calc(var(--u)*58);font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:calc(var(--u)*14)}.nm em{font-style:normal;color:#ff5fa8;font-size:calc(var(--u)*50)}
.cl{display:flex;align-items:center;gap:calc(var(--u)*12);color:#8fa5b3;font-size:calc(var(--u)*38)}.cl .i{width:calc(var(--u)*44);height:calc(var(--u)*44);color:#8fa5b3}
.hs{--ch:calc(var(--u)*20);--bd:rgba(0,255,247,.5);--fill:rgba(3,11,17,.92);flex:none;display:grid;justify-items:center;align-content:center;gap:calc(var(--u)*2);height:calc(var(--u)*140);padding:0 calc(var(--u)*14)}
.hs .i{width:calc(var(--u)*50);height:calc(var(--u)*50);color:var(--cy)}.hs b{font-size:calc(var(--u)*46);font-weight:700;line-height:1.1;white-space:nowrap}.hs small{font-size:calc(var(--u)*30);color:#8fa5b3;line-height:1}

    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), ang = Math.atan2(b.y - a.y, b.x - a.x), my = (a.y + b.y) / 2;
      if (pd) GL3.zoom(pd / d); GL3.rotate(ang - pa); GL3.tilt((my - pm) * .004); pd = d; pa = ang; pm = my; moved = 99; }
  });
  const up = e => { ptrs.delete(e.pointerId); };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up); box.addEventListener("contextmenu", e => e.preventDefault());
  box.addEventListener("click", e => { if (moved > 8) { e.stopPropagation(); e.preventDefault(); moved = 0; } }, true);
  box.addEventListener("wheel", e => { e.preventDefault(); if (use3D) GL3.zoom(e.deltaY < 0 ? .88 : 1.14); }, {passive: false});
})();

const MZ = {x: 0, y: 0, k: 1, bw: 0, bh: 0, cw: 0, ch: 0};
function applyMZ() {
  const k = MZ.k = Math.max(1, Math.min(3, MZ.k)), w = MZ.bw * k, h = MZ.bh * k;
  MZ.x = w > MZ.cw ? Math.max(MZ.cw - w, Math.min(0, MZ.x)) : (MZ.cw - w) / 2; MZ.y = h > MZ.ch ? Math.max(MZ.ch - h, Math.min(0, MZ.y)) : (MZ.ch - h) / 2;
  const mz = $("#mz"); mz.style.transform = `translate(${MZ.x}px,${MZ.y}px) scale(${k})`; mz.style.setProperty("--k", k);
}
function centerOn(key, k) { if (k) MZ.k = k; const p = HS[key] || [768, 512]; MZ.x = MZ.cw / 2 - p[0] / IW * MZ.bw * MZ.k; MZ.y = MZ.ch * .38 - p[1] / IH * MZ.bh * MZ.k; applyMZ(); }
function fitMap() {
  const r = $("#mapBox").getBoundingClientRect(); if (!r.width) return;
  MZ.cw = r.width; MZ.ch = r.height; MZ.bw = Math.max(r.height * IW / IH, r.width); MZ.bh = MZ.bw * IH / IW;
  const mz = $("#mz"); mz.style.width = MZ.bw + "px"; mz.style.height = MZ.bh + "px"; MZ.k = 1; centerOn(sel || (S && S.map));
}
function zoomAt(f, cx, cy) { const k2 = Math.max(1, Math.min(3, MZ.k * f)), r = k2 / MZ.k; MZ.x = cx - (cx - MZ.x) * r; MZ.y = cy - (cy - MZ.y) * r; MZ.k = k2; applyMZ(); }
(() => {
  const box = $("#mapBox"), ptrs = new Map(); let pd = 0, moved = 0, drag = false;
  box.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); moved = 0; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pd = Math.hypot(a.x - b.x, a.y - b.y); } });
  box.addEventListener("pointermove", e => {
    const p = ptrs.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (ptrs.size === 1) { moved += Math.abs(dx) + Math.abs(dy); if (moved > 8) { if (!drag) { drag = true; try { box.setPointerCapture(e.pointerId); } catch (_) {} } MZ.x += dx; MZ.y += dy; applyMZ(); } }
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = box.getBoundingClientRect(); if (pd) zoomAt(d / pd, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pd = d; moved = 99; }
  });
  const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) setTimeout(() => { drag = false; }, 0); };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  box.addEventListener("click", e => { if (moved > 8) { e.stopPropagation(); e.preventDefault(); } }, true);
  box.addEventListener("wheel", e => { e.preventDefault(); const r = box.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : .87, e.clientX - r.left, e.clientY - r.top); }, {passive: false});
})();
function buildMap() {
  $("#mks").innerHTML = R.filter(d => HS[d.key]).map(d => `<button class="mk" data-act="msel" data-k="${esc(d.key)}" aria-label="${esc(faName(d))}" style="left:${HS[d.key][0] / IW * 100}%;top:${HS[d.key][1] / IH * 100}%;--zc:${ZCOL[d.zone] || "#7F9DB5"}"><i></i><b>${esc(faName(d))}</b></button>`).join("");
}
function markMap() {
  $$(".mk,.gk").forEach(m => { const k = m.dataset.k; m.classList.toggle("on", k === sel); m.classList.toggle("here", !!S && k === S.map && !S.traveling); m.classList.toggle("dest", !!S && k === S.traveling); });
  if (use3D && S) GL3.setState(sel, S.traveling ? null : S.map, S.traveling || null, S.map);
  const a = S && HS[S.map], b = S && S.traveling && HS[S.traveling];
  $("#mapLn").innerHTML = a && b ? `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#00FFF7" stroke-width="3" stroke-dasharray="10 8" vector-effect="non-scaling-stroke"/>` : "";
}
function renderDock() {
  const d = sel && realm(sel), el = $("#rd"); if (!d) { el.innerHTML = ""; return; }
  const here = S.map === d.key, trav = S.traveling, noAct = S.actions <= 0;
  el.innerHTML = `<div class="pn gl row"><div class="top"><div><h2 style="font-size:17px">${esc(faName(d))}</h2><span class="en">${esc(d.key)}</span></div><div class="chips">${zchip(d.zone)}${tchip(d.tier)}<span class="chip cy">${here ? "همین‌جایی" : dur(d.secs)}</span></div></div>
    <div class="duo" style="margin:0"><button class="btn pn" data-act="rdet">جزئیات</button>${here ? `<button class="btn main pn" data-go="trip">جستجو</button>` : `<button class="btn main pn" data-act="go" data-k="${esc(d.key)}" ${trav || noAct ? "disabled" : ""}>${trav ? "در حال سفر" : noAct ? "اقدامی نمانده" : "سفر"}</button>`}</div></div>`;
}
function realmPanel(d) {
  if (!d) return `<div class="empty">قلمرویی انتخاب نشده.</div>`;
  return `<div class="rp"><div class="strip">${scene(d.key)}<div><h2>${esc(faName(d))}</h2><span class="en">${esc(d.key)}</span></div></div>
    <div class="body"><div class="chips">${zchip(d.zone)}${tchip(d.tier)}</div>
    <div class="kv"><div class="pn sm"><b>${S && S.map === d.key ? "فوری" : dur(d.secs)}</b><span>زمان سفر</span></div><div class="pn sm"><b>${fa((d.places || []).length)}</b><span>مکان</span></div><div class="pn sm"><b>${fa((d.loot || []).length)}</b><span>نوع منبع</span></div></div>
    ${d.places && d.places.length ? `<div class="places">${d.places.map(p => `<div><b>${esc(p.name)}</b><span>${esc(p.desc)}</span></div>`).join("")}</div>` : ""}
    ${d.loot && d.loot.length ? `<div class="chips">${d.loot.map(l => `<span class="chip ltr" style="border-color:${RCOL[l.rarity] || "var(--line2)"}">${esc(l.name)}</span>`).join("")}</div>` : ""}</div></div>`;
}

/* ───────── شخصیت ───────── */
function renderChar() {
  const k = CLS[S.cls] || CLS.adventurer, cur = S.map && realm(S.map), mem = GU ? GU.guilds.filter(g => g.member) : [], hp = pct(S.hp, S.max_hp || 1);
  const st = S.stats || {}, statNames = {str:"STR",strength:"STR",dex:"DEX",dexterity:"DEX",int:"INT",intelligence:"INT",vit:"VIT",vitality:"VIT",agi:"AGI",agility:"AGI",atk:"ATK",def:"DEF",magic:"MAG",speed:"SPD"};
  const statEntries = Object.entries(st).filter(([key,val]) => statNames[key] && Number.isFinite(Number(val))).filter(([key],i,arr) => !arr.some(([k2],j)=>j<i && statNames[k2]===statNames[key]));
  const gear = Array.isArray(S.equipment) ? S.equipment : [];
  const gearNames = {weapon:"سلاح",helmet:"کلاه‌خود",armor:"زره",gloves:"دستکش",boots:"چکمه",ring:"انگشتر",amulet:"گردنبند",relic:"رلیک"};
  const bonusEntries = Object.entries(S.equipment_bonuses || {}).filter(([,v]) => Number.isFinite(Number(v)) && Number(v) !== 0).slice(0,12);
  const gearHtml = gear.length ? `<div class="stack">${gear.map(it=>`<div class="pn row"><span class="gem pn" style="width:38px;height:38px">${esc(it.emoji||"◇")}</span><div class="t"><b>${esc(it.name)}</b><span>${esc(gearNames[it.slot]||it.slot)} · ${esc(RAR[it.rarity]||it.rarity||"")}${it.level != null ? " · Lv. " + fa(it.level) : ""}</span></div><button class="btn sm pn" data-act="unequipItem" data-slot="${esc(it.slot)}">درآوردن</button></div>`).join("")}</div>` : `<div class="empty">هنوز تجهیزی در اسلات‌های شخصیت ثبت نشده است.</div>`;
  const statHtml = statEntries.length ? `<div class="kv stat">${statEntries.map(([key,val])=>`<div class="pn sm"><b>${fa(val)}</b><span>${statNames[key]}</span></div>`).join("")}</div>` : `<div class="note">آمار STR / DEX و موارد مشابه در داده‌ی فعلی حساب ذخیره نشده‌اند؛ عدد ساختگی نمایش داده نمی‌شود.</div>`;
  const bonusHtml = bonusEntries.length ? `<div class="chips">${bonusEntries.map(([key,val])=>`<span class="chip">${esc(key.replaceAll("_"," "))} ${Number(val)>0?"+":""}${fa(val)}</span>`).join("")}</div>` : `<div class="note">افیکس فعال ثبت‌شده‌ای برای تجهیزات پیدا نشد.</div>`;
  $("#v-char").innerHTML = `<div class="hero sm phero"><div class="lbg"></div><div class="tint"></div><div class="fog"></div>${stage(k)}
      <div class="loc"><h1>${esc(S.name || "—")}</h1><div class="chips" style="margin-top:6px"><span class="chip cy">سطح ${fa(S.level)}</span><span class="chip">${k.fa}</span>${S.gender === "female" || S.gender === "male" ? `<span class="chip">${S.gender === "female" ? "زن" : "مرد"}</span>` : ""}</div></div></div>
    <div class="stack" style="margin-top:12px"><div class="pn row" style="display:block"><div class="meta"><span>سلامتی</span><b>${fa(S.hp)} / ${fa(S.max_hp)}</b></div><div class="bar ${hp <= 30 ? "low" : ""}"><i style="width:${hp}%"></i></div></div>
    <div class="kv"><div class="pn sm"><b>${fa(S.level)}</b><span>سطح</span></div><div class="pn sm"><b>${fa(S.xp)}</b><span>تجربه</span></div><div class="pn sm"><b>${fa(S.zen)}</b><span>زن</span></div>
      <div class="pn sm"><b>${fa(S.actions)}</b><span>اقدام</span></div><div class="pn sm"><b>${fa(S.daily_left)}</b><span>سهم امروز</span></div><div class="pn sm"><b>${fa((S.inventory || []).length)}</b><span>آیتم</span></div></div></div>
    <h3>آمار شخصیت</h3>${statHtml}<h3>تجهیزات فعال</h3>${gearHtml}<h3>بونوس تجهیزات</h3>${bonusHtml}
    <h3>پیشرفت در گیلدها</h3>${GU ? (mem.length ? `<div class="stack">${mem.map(g => `<button class="pn row gcard" data-act="gd" data-id="${esc(g.id)}"><span class="em">${g.emoji}</span><div class="t"><b>${esc(g.name)}</b><span>${fa(g.contribution)} امتیاز مشارکت</span></div><span class="chip cy">${esc(g.rank_fa)}</span></button>`).join("")}</div>` : `<div class="empty" style="padding:14px"><b>عضو هیچ گیلدی نیستی</b><button class="btn sm pn" style="margin:10px auto 0" data-go="guild">دیدن گیلدها</button></div>`) : `<div class="skel"></div>`}`;
}

/* ───────── گیلد ───────── */
let GU = null, GFAIL = false;
async function loadGuilds() { try { GU = await api("/api/guilds"); GFAIL = false; } catch (e) { GFAIL = true; } renderGuild(); if (S) { renderChar(); renderHUD(); renderHome(); startTimer(); } cropAll(); if (view === "quests") loadQuests(); }
function renderGuild() {
  let h = `<div class="head"><div><h1>گیلدها</h1><div class="sub">${GU ? fa(GU.guilds.length) + " گیلد" : ""}</div></div></div>`;
  if (!GU) h += GFAIL ? `<div class="empty"><b>بارگذاری گیلدها انجام نشد</b><button class="btn sm pn" style="margin:10px auto 0" data-act="gretry">تلاش دوباره</button></div>` : `<div class="skel"></div><div class="skel"></div>`;
  else {
    h += `<div class="pn hot gl-war"><div class="meta"><span>جنگ هفتگی گیلدها</span><b>${dur(GU.war.remain)} مانده</b></div>${GU.war.last_winner_name ? `<span class="sub">برنده‌ی هفته‌ی قبل: ${esc(GU.war.last_winner_name)} · پاداش ${fa(GU.war.buff_pct)}٪ تجربه</span>` : `<span class="sub">هنوز برنده‌ای ثبت نشده.</span>`}</div><div class="stack">`
      + GU.guilds.map(g => `<button class="pn row gcard" data-act="gd" data-id="${esc(g.id)}"><span class="em">${g.emoji}</span><div class="t"><b>${esc(g.name)}</b><span>${esc(g.npc)}${g.perk ? " · " + esc(g.perk) : ""} · امتیاز جنگ ${fa(g.war_score)}</span></div>${g.member ? `<span class="chip cy">${esc(g.rank_fa)}</span>` : `<span class="chip">آزاد</span>`}</button>`).join("") + `</div>`;
  }
  $("#v-guild").innerHTML = h;
}
async function guildSheet(id) {
  openSheet(`<div class="skel"></div>`);
  try {
    const g = await api("/api/guild/" + encodeURIComponent(id));
    let h = `<div class="row" style="padding:0 0 8px"><span style="font-size:32px">${g.emoji}</span><div class="t"><h2>${esc(g.name)}</h2><span>${esc(g.npc)}</span></div></div><p>${esc(g.desc)}</p>`;
    if (!g.member) h += `<div class="stack"><button class="btn main pn" data-act="gjoin" data-id="${esc(id)}">پیوستن به گیلد</button></div>`;
    else h += `<div class="meta"><span>رتبه‌ی ${esc(g.rank_fa)}${g.next_fa ? " ← " + esc(g.next_fa) : ""}</span><b>${fa(g.contribution)}${g.need ? " / " + fa(g.need) : ""}</b></div><div class="bar"><i style="width:${Math.round((g.pct || 0) * 100)}%"></i></div>
      <div class="kv stat"><div class="pn sm"><b>${fa(g.quests_done)}</b><span>کوئست انجام‌شده</span></div><div class="pn sm"><b>${fa(g.bonus_pct)}٪</b><span>پاداش رتبه</span></div><div class="pn sm"><b>${fa(g.perk_pct)}٪</b><span>${esc(g.perk_label || "مزیت")}</span></div></div>
      ${g.quest ? `<div class="chips" style="margin-top:10px"><span class="chip cy">کوئست فعال دارد (از ربات ادامه بده)</span></div>` : ""}
      <div class="stack"><button class="btn pn" data-act="gact" data-id="${esc(id)}" ${g.action_ready ? "" : "disabled"}>${esc(g.action.name)}${g.action_ready ? "" : " · " + dur(g.action_remain)}</button></div>`;
    openSheet(h);
  } catch (e) { closeSheet(); toast(e.message, 1); }
}
async function gOp(op, id) {
  if (busy) return; busy = true;
  try { const r = await api("/api/guild/" + op, {gid: id}); setS(r); toast(r.msg || "انجام شد", !r.ok); hap("medium"); renderAll(); await loadGuilds(); guildSheet(id); }
  catch (e) { toast(e.message, 1); } finally { busy = false; }
}

/* ───────── رویدادها و ناوبری ───────── */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { hap(); show(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return; const d = a.dataset;
  switch (d.act) {
    case "msel": hap(); sel = d.k; markMap(); renderDock(); if (use3D) GL3.flyTo(sel, Math.min(GL3.cam.d, 1.7)); break;
    case "closeApp": try { tg.close(); } catch (_) {} break;
    case "ztilt": if (use3D) GL3.cam.pit = GL3.cam.pit > .8 ? .5 : 1.05; break;
    case "zrot": if (use3D) GL3.north(); break;
    case "rdet": hap(); openSheet(realmPanel(realm(sel))); cropAll(); break;
    case "zin": if (use3D) GL3.zoom(.74); else zoomAt(1.4, MZ.cw / 2, MZ.ch / 2); break;
    case "zout": if (use3D) GL3.zoom(1.35); else zoomAt(.71, MZ.cw / 2, MZ.ch / 2); break;
    case "zhere": if (use3D) GL3.flyTo(S.map || sel, 1.5); else centerOn(S.map || sel, 1.6); break;
    case "gd": hap(); guildSheet(d.id); break;
    case "gjoin": gOp("join", d.id); break;
    case "gact": gOp("action", d.id); break;
    case "gretry": GFAIL = false; GU = null; renderGuild(); loadGuilds(); break;
  }
});
function show(v) {
  view = v;
  $$(".view").forEach(x => { x.classList.toggle("on", x.id === "v-" + v); x.scrollTop = 0; });
  const tab = {char: "home", guild: "home", market: "home", bank: "home", quests: "home", trip: "more", combat: "more"}[v] || v;
  $$("nav button").forEach(b => b.dataset.v === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  closeSheet(); cropAll();
  if (v === "map") { if (use3D) enter3D(); else if (document.body.classList.contains("no3d")) fitMap(); } else if (use3D) GL3.stop();
  if (v === "market") loadMarket();
  if (v === "bank") loadBank();
  if (v === "quests") loadQuests();
  if (v === "more") renderMore();
  if (v === "combat") loadCombat();
}
$$("nav button").forEach(b => b.onclick = () => { hap(); show(b.dataset.v); });

function renderAll() { renderHUD(); renderHome(); markMap(); renderDock(); renderChar(); renderBag(); renderGuild(); renderTrip(); renderQuests(); renderMore(); renderCombat(); if (BM) renderMarket(); if (BK) renderBank(); startTimer(); cropAll(); fitStage(); }
async function boot() {
  try {
    const [r, s] = await Promise.all([api("/api/realms"), api("/api/me")]); R = r; setS(s);
    sel = S.map || (R[0] && R[0].key); buildMap(); await loadMap(); if (S.map && !M) failed = "map";
    $("#boot").hidden = true; renderAll(); loadGuilds(); build3D();
  } catch (e) {
    $("#boot").innerHTML = `<div class="empty"><b>${esc(e.message)}</b>مینی‌اپ رو از داخل ربات باز کن.<br><button class="btn pn" style="margin-top:14px" onclick="location.reload()">تلاش دوباره</button></div>`;
  }
}
renderHUD(); boot();
</script>
